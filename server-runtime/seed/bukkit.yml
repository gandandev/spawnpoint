settings:
  allow-end: true
  # The loopback Eagler listener only receives authenticated gateway traffic.
  # Per-IP throttling here groups a whole school or home NAT together.
  connection-throttle: -1
  warn-on-overload: true
spawn-limits:
  monsters: 45
  animals: 8
  water-animals: 4
  ambient: 4
ticks-per:
  animal-spawns: 500
  monster-spawns: 2
  autosave: 6000

