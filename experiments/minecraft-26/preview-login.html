<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spawnpoint Java 26.2 테스트</title>
<style>body{margin:0;background:#151815;color:#e7eae5;font:16px/1.7 system-ui}main{max-width:460px;margin:12vh auto;padding:24px}input,button{box-sizing:border-box;display:block;width:100%;padding:14px;margin:10px 0;font:inherit;border:1px solid #586351;background:#20251f;color:inherit}small{color:#b4bdad}#error{color:#ffb3a8}</style>
<main><h1>Java 26.2 테스트</h1><p>기존 Spawnpoint 계정으로 로그인하세요.</p>
<form><label>플레이어 이름<input name="username" autocomplete="username" required maxlength="16"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button>로그인</button></form><p id="error" role="alert"></p>
<small>운영 서버에서 복사한 인벤토리와 경험치를 새 월드에서 테스트해요. 여기서의 플레이는 메인 서버에 반영되지 않아요.</small></main><script src="/preview-login.js"></script></html>
