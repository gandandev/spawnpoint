name: SpawnpointBridge
version: 1.2.10
main: dev.spawnpoint.SpawnpointBridgePlugin
author: spawnpoint
description: spawnpoint 계정을 확인하고 로컬 포털 연결을 제공합니다.
depend:
  - EaglercraftXServer
commands:
  tpa:
    description: 온라인 플레이어에게 순간이동을 요청하거나 TPA를 설정합니다.
    aliases: [티피에이, 티피요청, 텔포]
    usage: "/tpa <이름> | /티피에이 <이름> | /텔포 <이름> | /tpa <on|off>"
  tpaccept:
    description: 최근 TPA 요청을 수락합니다.
    aliases: [티피수락, 수락]
    usage: "/tpaccept | /티피수락 | /수락"
  tpdeny:
    description: 최근 TPA 요청을 거절합니다.
    aliases: [티피거절, 거절]
    usage: "/tpdeny | /티피거절 | /거절"
  spawnpointtell:
    description: 온라인 플레이어에게 귓속말을 보냅니다.
    aliases: [귓, 귓속말]
    usage: "/귓 <이름> <문구> | /귓속말 <이름> <문구>"
